<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="ga" cx="15%" cy="10%" r="60%"><stop offset="0" stop-color="#047857" stop-opacity=".55"/><stop offset="1" stop-color="#047857" stop-opacity="0"/></radialGradient>
    <radialGradient id="gb" cx="90%" cy="90%" r="55%"><stop offset="0" stop-color="#0e7490" stop-opacity=".55"/><stop offset="1" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="txt" x1="0" x2="1"><stop offset="0" stop-color="#34d399"/><stop offset=".55" stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="gate" x1="0" x2="1"><stop offset="0" stop-color="#059669" stop-opacity=".7"/><stop offset="1" stop-color="#2563eb" stop-opacity=".6"/></linearGradient>
    <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".12" stop-color="#fff" stop-opacity="1"/><stop offset=".88" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <mask id="m"><rect width="1280" height="400" fill="url(#fade)"/></mask>
    <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
    <style>
      .wire { stroke: #94a3b8; stroke-opacity: .18; stroke-width: 1.5; }
      .pulse { fill: #22d3ee; filter: url(#blur); }
      .p1 { animation: run 6s linear infinite; }
      .p2 { animation: run 7.5s linear infinite -2s; fill: #34d399; }
      .p3 { animation: run 5.5s linear infinite -4s; }
      .p4 { animation: run 8s linear infinite -1s; fill: #3b82f6; }
      .p5 { animation: run 6.5s linear infinite -3s; fill: #34d399; }
      @keyframes run { from { transform: translateX(0); } to { transform: translateX(1280px); } }
      .orbit { transform-origin: 1068px 200px; animation: spin 14s linear infinite; }
      .orbit.b { animation-duration: 20s; animation-direction: reverse; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .blink { animation: blink 2.4s ease-in-out infinite; }
      @keyframes blink { 50% { opacity: .35; } }
    </style>
  </defs>

  <rect width="1280" height="400" rx="24" fill="#04050d"/>
  <rect width="1280" height="400" rx="24" fill="url(#ga)"/>
  <rect width="1280" height="400" rx="24" fill="url(#gb)"/>

  <g mask="url(#m)">
    <g class="wire">
      <line x1="0" x2="1280" y1="40" y2="40"/><line x1="0" x2="1280" y1="80" y2="80"/>
      <line x1="0" x2="1280" y1="345" y2="345"/><line x1="0" x2="1280" y1="378" y2="378"/>
    </g>
    <g fill="url(#gate)" stroke="#34d399" stroke-opacity=".35">
      <rect x="140" y="28" width="34" height="24" rx="6"/><rect x="420" y="68" width="34" height="24" rx="6"/>
      <rect x="700" y="28" width="34" height="24" rx="6"/><rect x="250" y="333" width="34" height="24" rx="6"/>
      <rect x="610" y="366" width="34" height="24" rx="6"/><rect x="880" y="333" width="34" height="24" rx="6"/>
    </g>
    <g stroke="#22d3ee" stroke-opacity=".35" stroke-width="1.5">
      <line x1="300" y1="40" x2="300" y2="80"/><circle cx="300" cy="40" r="4" fill="#22d3ee" fill-opacity=".5"/><circle cx="300" cy="80" r="7" fill="none"/>
      <line x1="470" y1="345" x2="470" y2="378"/><circle cx="470" cy="345" r="4" fill="#22d3ee" fill-opacity=".5"/><circle cx="470" cy="378" r="7" fill="none"/>
    </g>
    <circle class="pulse p1" cx="-20" cy="40" r="5"/>
    <circle class="pulse p2" cx="-20" cy="80" r="5"/>
    <circle class="pulse p3" cx="-20" cy="345" r="5"/>
    <circle class="pulse p4" cx="-20" cy="378" r="5"/>
    <circle class="pulse p5" cx="-200" cy="40" r="4"/>
  </g>

  <g transform="translate(96 0)">
    <rect x="0" y="110" width="292" height="30" rx="15" fill="#10b981" fill-opacity=".1" stroke="#10b981" stroke-opacity=".45"/>
    <circle class="blink" cx="20" cy="125" r="4" fill="#22d3ee"/>
    <text x="34" y="130" font-size="14" fill="#a7f3d0">QAOA on a simulated quantum circuit</text>
    <text x="0" y="205" font-size="58" font-weight="800" fill="#e6e9f5" letter-spacing="-1.5">Quantum <tspan fill="url(#txt)">Portfolio</tspan></text>
    <text x="0" y="268" font-size="58" font-weight="800" fill="#e6e9f5" letter-spacing="-1.5">Optimizer</text>
    <text x="0" y="310" font-size="19" fill="#8b95b0">Delta-hedged stock picks with QAOA, Black-Scholes and an exact classical check</text>
  </g>

  <g stroke-width="2" fill="none">
    <circle cx="1068" cy="200" r="120" stroke="#10b981" stroke-opacity=".08" stroke-width="40"/>
    <g class="orbit"><ellipse cx="1068" cy="200" rx="110" ry="38" stroke="#34d399" stroke-opacity=".8"/><circle cx="1178" cy="200" r="7" fill="#34d399" stroke="none"/></g>
    <g class="orbit b"><ellipse cx="1068" cy="200" rx="110" ry="38" stroke="#22d3ee" stroke-opacity=".8" transform="rotate(60 1068 200)"/><circle cx="1013" cy="105" r="7" fill="#22d3ee" stroke="none"/></g>
    <g class="orbit"><ellipse cx="1068" cy="200" rx="110" ry="38" stroke="#3b82f6" stroke-opacity=".8" transform="rotate(-60 1068 200)"/><circle cx="1013" cy="295" r="7" fill="#3b82f6" stroke="none"/></g>
    <circle cx="1068" cy="200" r="16" fill="url(#txt)" stroke="none"/>
  </g>
</svg>
